<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="ONYX — Player 1 — Full-Stack AI Engineer">
  <defs>
    <rect id="p" width="20" height="20" rx="3"/>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16204a" stroke-width="1"/>
    </pattern>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.35"/>
    </pattern>

    <radialGradient id="ambCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambMag" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c026d3" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#c026d3" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#e879f9"/>
      <stop offset="0.75" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <filter id="blurFar" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blurNear" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blurTight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- pixel-grid wordmark: O N Y X -->
    <g id="word">
      <g transform="translate(358,50)">
        <use href="#p" x="20" y="0"/><use href="#p" x="40" y="0"/><use href="#p" x="60" y="0"/>
        <use href="#p" x="0" y="20"/><use href="#p" x="80" y="20"/>
        <use href="#p" x="0" y="40"/><use href="#p" x="80" y="40"/>
        <use href="#p" x="0" y="60"/><use href="#p" x="80" y="60"/>
        <use href="#p" x="0" y="80"/><use href="#p" x="80" y="80"/>
        <use href="#p" x="0" y="100"/><use href="#p" x="80" y="100"/>
        <use href="#p" x="20" y="120"/><use href="#p" x="40" y="120"/><use href="#p" x="60" y="120"/>
      </g>
      <g transform="translate(486,50)">
        <use href="#p" x="0" y="0"/><use href="#p" x="80" y="0"/>
        <use href="#p" x="0" y="20"/><use href="#p" x="20" y="20"/><use href="#p" x="80" y="20"/>
        <use href="#p" x="0" y="40"/><use href="#p" x="20" y="40"/><use href="#p" x="80" y="40"/>
        <use href="#p" x="0" y="60"/><use href="#p" x="40" y="60"/><use href="#p" x="80" y="60"/>
        <use href="#p" x="0" y="80"/><use href="#p" x="60" y="80"/><use href="#p" x="80" y="80"/>
        <use href="#p" x="0" y="100"/><use href="#p" x="60" y="100"/><use href="#p" x="80" y="100"/>
        <use href="#p" x="0" y="120"/><use href="#p" x="80" y="120"/>
      </g>
      <g transform="translate(614,50)">
        <use href="#p" x="0" y="0"/><use href="#p" x="80" y="0"/>
        <use href="#p" x="0" y="20"/><use href="#p" x="80" y="20"/>
        <use href="#p" x="20" y="40"/><use href="#p" x="60" y="40"/>
        <use href="#p" x="40" y="60"/>
        <use href="#p" x="40" y="80"/>
        <use href="#p" x="40" y="100"/>
        <use href="#p" x="40" y="120"/>
      </g>
      <g transform="translate(742,50)">
        <use href="#p" x="0" y="0"/><use href="#p" x="80" y="0"/>
        <use href="#p" x="0" y="20"/><use href="#p" x="80" y="20"/>
        <use href="#p" x="20" y="40"/><use href="#p" x="60" y="40"/>
        <use href="#p" x="40" y="60"/>
        <use href="#p" x="20" y="80"/><use href="#p" x="60" y="80"/>
        <use href="#p" x="0" y="100"/><use href="#p" x="80" y="100"/>
        <use href="#p" x="0" y="120"/><use href="#p" x="80" y="120"/>
      </g>
    </g>
  </defs>

  <style>
    @keyframes flick {
      0%,88%,100% { opacity: 1 }
      89% { opacity: .45 }
      90% { opacity: 1 }
      93% { opacity: .7 }
      94% { opacity: 1 }
    }
    @keyframes breathe {
      0%,100% { opacity: .45 }
      50%     { opacity: .8 }
    }
    @keyframes drift {
      0%,100% { transform: translateX(0) }
      50%     { transform: translateX(28px) }
    }
    .flick   { animation: flick 7s steps(1,end) infinite }
    .breathe { animation: breathe 3.4s ease-in-out infinite }
    .drift   { animation: drift 11s ease-in-out infinite }
    .tag     { font-family: "DejaVu Sans Mono","Liberation Mono",Menlo,Consolas,monospace }
  </style>

  <rect width="1200" height="320" fill="#080b14"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.6"/>

  <g class="drift">
    <ellipse cx="300" cy="150" rx="340" ry="170" fill="url(#ambCyan)"/>
    <ellipse cx="900" cy="170" rx="340" ry="170" fill="url(#ambMag)"/>
  </g>

  <g class="flick">
    <use href="#word" fill="#c026d3" filter="url(#blurFar)" class="breathe"/>
    <use href="#word" fill="#22d3ee" filter="url(#blurNear)" opacity="0.95"/>
    <use href="#word" fill="#67e8f9" filter="url(#blurTight)"/>
    <use href="#word" fill="#f0feff"/>
  </g>

  <g class="flick">
    <rect x="260" y="212" width="680" height="2" fill="url(#ruleGrad)" filter="url(#blurTight)"/>
    <rect x="260" y="212" width="680" height="2" fill="url(#ruleGrad)"/>
    <g fill="#e879f9">
      <rect x="592" y="205" width="16" height="16" transform="rotate(45 600 213)" filter="url(#blurNear)" opacity="0.8"/>
      <rect x="594" y="207" width="12" height="12" transform="rotate(45 600 213)"/>
    </g>
  </g>

  <g class="tag flick" text-anchor="middle">
    <text x="600" y="262" font-size="17" letter-spacing="7" fill="#22d3ee" filter="url(#blurNear)" opacity="0.7">PLAYER 1</text>
    <text x="600" y="262" font-size="17" letter-spacing="7" fill="#a5f3fc">PLAYER 1</text>
    <text x="600" y="291" font-size="13" letter-spacing="4.5" fill="#8b9ad4">FULL-STACK AI ENGINEER</text>
  </g>

  <rect width="1200" height="320" fill="url(#scan)"/>
</svg>
