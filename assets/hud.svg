<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-label="Character sheet: Full-Stack AI Engineer, HP 94, MP 88, XP max">
  <defs>
    <pattern id="hgrid" width="41" height="41" patternUnits="userSpaceOnUse">
      <path d="M41 0H0V41" fill="none" stroke="#141d3d" stroke-width="1"/>
    </pattern>
    <pattern id="hscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.3"/>
    </pattern>

    <radialGradient id="hAmb" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#5b21b6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>

    <filter id="hGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="hSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

  </defs>

  <style>
    .m    { font-family: "DejaVu Sans Mono","Liberation Mono",Menlo,Consolas,monospace }
    .lbl  { font-size: 13px; letter-spacing: 2.6px; fill: #6d7cb8 }
    .val  { font-size: 15px; fill: #dbe4ff }
    .bar  { font-size: 12px; letter-spacing: 1.6px; fill: #6d7cb8 }
    .num  { font-size: 13px; fill: #e8eeff }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:.95} }
    @keyframes maxed { 0%,100%{opacity:1} 50%{opacity:.82} }
    .blink { animation: blink 1.1s steps(1,end) infinite }
    .pulse { animation: pulse 2.8s ease-in-out infinite }
    .maxed { animation: maxed 2.4s ease-in-out infinite }
  </style>

  <rect width="820" height="430" rx="10" fill="#080b14"/>
  <rect width="820" height="430" rx="10" fill="url(#hgrid)" opacity="0.7"/>
  <ellipse cx="410" cy="10" rx="440" ry="200" fill="url(#hAmb)"/>

  <!-- panel frame + corner brackets -->
  <rect x="14" y="14" width="792" height="402" rx="7" fill="none" stroke="#1e2b57" stroke-width="1.5"/>
  <g stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="square">
    <g filter="url(#hSoft)" opacity="0.85">
      <path d="M14 54V14h40M766 14h40v40M806 376v40h-40M54 416H14v-40"/>
