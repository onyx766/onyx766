<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Continue? Press any key">
  <defs>
    <pattern id="fgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16204a" stroke-width="1"/>
    </pattern>
    <pattern id="fscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.35"/>
    </pattern>
    <radialGradient id="fAmb" cx="50%" cy="100%" r="75%">
      <stop offset="0" stop-color="#c026d3" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#c026d3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#e879f9"/>
      <stop offset="0.7" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="fSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <style>
    .fm { font-family: "DejaVu Sans Mono","Liberation Mono",Menlo,Consolas,monospace }
    @keyframes fflick {
      0%,86%,100% { opacity: 1 }
      87% { opacity: .4 }
      88% { opacity: 1 }
      91% { opacity: .65 }
      92% { opacity: 1 }
    }
    @keyframes fblink { 0%,49%{opacity:1} 50%,100%{opacity:.08} }
    @keyframes fbreathe { 0%,100%{opacity:.45} 50%{opacity:.85} }
    .fflick   { animation: fflick 8s steps(1,end) infinite }
    .fbreathe { animation: fbreathe 3.6s ease-in-out infinite }
    .d1 { animation: fblink 1.4s steps(1,end) infinite }
    .d2 { animation: fblink 1.4s steps(1,end) .18s infinite }
    .d3 { animation: fblink 1.4s steps(1,end) .36s infinite }
  </style>

  <rect width="1200" height="220" fill="#080b14"/>
  <rect width="1200" height="220" fill="url(#fgrid)" opacity="0.6"/>
  <ellipse cx="600" cy="220" rx="520" ry="180" fill="url(#fAmb)"/>

  <g class="fflick">
    <rect x="260" y="44" width="680" height="2" fill="url(#fRule)" filter="url(#fSoft)"/>
    <rect x="260" y="44" width="680" height="2" fill="url(#fRule)"/>
  </g>

  <g class="fm" text-anchor="middle">
    <g class="fflick">
      <text x="565" y="126" font-size="40" letter-spacing="8" fill="#c026d3" filter="url(#fGlow)" class="fbreathe">CONTINUE?</text>
      <text x="565" y="126" font-size="40" letter-spacing="8" fill="#67e8f9" filter="url(#fSoft)">CONTINUE?</text>
      <text x="565" y="126" font-size="40" letter-spacing="8" fill="#f0feff">CONTINUE?</text>
    </g>
    <g fill="#e879f9" filter="url(#fSoft)">
      <circle cx="790" cy="114" r="7" class="d1"/>
      <circle cx="818" cy="114" r="7" class="d2"/>
      <circle cx="846" cy="114" r="7" class="d3"/>
    </g>
    <text x="600" y="176" font-size="13" letter-spacing="6" fill="#7285c4">PRESS ANY KEY TO START A NEW RUN</text>
  </g>

  <rect width="1200" height="220" fill="url(#fscan)"/>
</svg>
